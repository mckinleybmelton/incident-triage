# Grok Bot routine webhook receiver (alternate path).
# See docs/grok-bot/customer-setup.md. Prefer fixtures/alertmanager/receiver.snippet.yml
# for the Agent SDK channel.

route:
  receiver: grok-bot-triage
  group_by: ["alertname", "service", "namespace"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: grok-bot-triage
    webhook_configs:
      - url: "POST_TO_URL"
        send_resolved: true
        max_alerts: 10
        http_config:
          authorization:
            type: Bearer
            credentials: "ROUTINE_BEARER_KEY"
          follow_redirects: true
