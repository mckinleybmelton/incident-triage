# Alertmanager receiver snippet for the Agent SDK alertmanager channel.
# Replace ALIAS_OR_LOCAL_BASE and INCIDENT_TRIAGE_WEBHOOK_SECRET.
#
# Local (agent-sdk serve --dev):
#   url: "http://127.0.0.1:3000/incident-triage/v1/channels/alertmanager/"
# Hosted:
#   url: "<AGENT_ALIAS_URL>/v1/channels/alertmanager/"
#
# For the Grok Bot routine webhook shape instead, see docs/grok-bot/
# and fixtures/alertmanager/receiver.grok-bot.snippet.yml.

route:
  receiver: incident-triage-agent
  group_by: ["alertname", "service", "namespace"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity =~ "critical|warning"
      receiver: incident-triage-agent
      continue: false

receivers:
  - name: incident-triage-agent
    webhook_configs:
      - url: "ALIAS_OR_LOCAL_BASE/v1/channels/alertmanager/"
        send_resolved: true
        max_alerts: 10
        http_config:
          authorization:
            type: Bearer
            credentials: "INCIDENT_TRIAGE_WEBHOOK_SECRET"
          follow_redirects: true
